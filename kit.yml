---
name:    garage
version: 0.2.0

author:
  - Wayne Seguin <weseguin@fivetwenty.io>
code:    https://github.com/genesis-community/garage-genesis-kit
docs:    https://genesisproject.io/docs/

genesis_version_min: 3.1.0

services:
- s3

supports:
- aws
- azure
- gcp
- openstack
- pve
- vsphere
- stackit

required_configs:
  # The manifest takes static IPs from the cloud config network, so the
  # blueprint and check hooks both need it.
  cloud: [ blueprint, manifest, check ]

credentials:
  base:
    # Garage cluster credentials, generated on `genesis add-secrets`.
    #
    # access_key, secret_key, and rpc_secret are fixed, so that
    # `genesis rotate-secrets` leaves them alone.  A new S3 key no longer
    # matches the one Garage already stores, and a new rpc_secret splits a
    # rolling deploy, because nodes holding different secrets cannot talk.
    # Rotate the rpc_secret and admin_token with the reset-credentials (r)
    # addon, which prints the full-stop procedure that applies them.
    credentials:
      access_key:  random 32 allowed-chars 0-9a-f fixed  # 32-hex suffix of GK<access_key>
      secret_key:  random 64 allowed-chars 0-9a-f fixed  # S3 secret key
      rpc_secret:  random 64 allowed-chars 0-9a-f fixed  # shared cluster RPC secret
      admin_token: random 32 allowed-chars 0-9a-f        # admin API bearer token

certificates:
  base:
    certs:
      ca: { valid_for: 10y }  # Reserved for future external client verification.
